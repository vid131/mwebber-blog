baseURL = 'https://michael-webber.com/'
locale = 'en-us'
title = 'Michael Webber'
theme = "PaperMod"
googleAnalytics = 'G-WLK11FRDZQ'

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]

# Global Parameters (Keep these together)
[params]
  googleAnalytics = "G-WLK11FRDZQ"
  defaultTheme = "light"
  disableThemeToggle = true 
  ShowShareButtons = true     
  ShowReadingTime = true
  ShowPostNavLinks = true

# Profile Mode Configuration (Must sit below general params)
[params.profileMode]
  enabled = true
  title = "Michael Webber"
  subtitle = "A Work In Progress."

  # Added a direct button right on your profile card for quick navigation
  [[params.profileMode.buttons]]
    name = "Read the Blog"
    url = "/posts/"

  [[params.profileMode.buttons]]
    name = "Start Here"
    url = "/posts/2026_11_03-start-here/"

# Top Right Navigation Menu Links
[[menu.main]]
  name = "Archive"
  url = "/posts/"
  weight = 10

[[menu.main]]
  name = "The Station"
  url = "/categories/the-station/"
  weight = 20

[[menu.main]]
  name = "The Road"
  url = "/categories/the-road/"
  weight = 30

[[menu.main]]
  name = "Field Notes"
  url = "/categories/field-notes/"
  weight = 40

# Add this block for the RSS Menu Link
[[menu.main]]
  name = "RSS"
  url = "/index.xml"
  weight = 50

[params.search]
enable = true
title = "Search the Log"
type = "fuse"
showShareButton = false

# Fuse.js specific tuning parameters
[params.search.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 100
threshold = 0.4
minMatchCharLength = 2
keys = ["title", "permalink", "summary", "content"]